    <script>
      // Apply saved theme + language before the page paints (avoids a white flash in dark mode).
      (function () {
        try {
          var t = localStorage.getItem("ranilix.theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var l = localStorage.getItem("ranilix.lang") === "he" ? "he" : "en";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "he" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
