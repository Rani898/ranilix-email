name: Deploy server (Cloudflare Worker)

# Uploads the mail server + Discord bot to Cloudflare whenever server/ changes.
# Needs one GitHub secret: CLOUDFLARE_API_TOKEN (see server/SETUP-HE.md).
# Optional secrets, copied to the Worker when present: RESEND_API_KEY, GOOGLE_CLIENT_SECRET, DISCORD_BOT_TOKEN.

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e44ae2d9bee582b93a195dad24a674ce
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Use this account's database and file storage
        run: |
          sed -i 's/^database_id = ".*"/database_id = "8ec425e0-6275-4fb4-932e-50c1b5c46512"/' wrangler.toml
          sed -i 's/^id = ".*"/id = "8851017c67eb4487be583728fbabff75"/' wrangler.toml

      - name: Create new tables (keeps existing data)
        run: npx wrangler d1 execute ranilix-email --remote --file=schema.sql --yes

      - name: Upload the server
        run: npx wrangler deploy

      - name: Copy optional secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          for name in RESEND_API_KEY GOOGLE_CLIENT_SECRET DISCORD_BOT_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "Saved $name"
            fi
          done

      - name: Check the server answers
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.ranilix.com/ | grep -q '"ok":true'; then echo "Server is up"; exit 0; fi
            sleep 10
          done
          echo "::warning::The server didn't answer yet. It can take a minute."
