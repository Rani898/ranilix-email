name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Set in GitHub → Settings → Secrets and variables → Actions → Variables (API_URL)
          VITE_API_URL: ${{ vars.API_URL || 'https://api.ranilix.com' }}
      # SPA fallback so /signup and /login work on refresh
      - run: cp dist/index.html dist/404.html && for r in privacy inbox login signup settings drive share room admin receipts calendar; do mkdir -p dist/$r && cp dist/index.html dist/$r/index.html; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
