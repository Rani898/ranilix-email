name = "ranilix-email-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The API runs at https://api.ranilix.com (Cloudflare creates the DNS record on deploy)
routes = [{ pattern = "api.ranilix.com", custom_domain = true }]

[vars]
# Your mail domain (must match the domain in Cloudflare Email Routing)
MAIL_DOMAIN = "ranilix.com"
# Usernames that can open the admin panel (comma-separated, without @domain)
ADMIN_USERS = "rani,rani4"
# Google "Connect Gmail" (optional). Paste the OAuth Client ID here; the secret goes in with setup.bat.
GOOGLE_CLIENT_ID = ""
# Sites allowed to call the API (comma-separated)
ALLOWED_ORIGINS = "https://rani898.github.io,https://ranilix.com,https://www.ranilix.com,http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "ranilix-email"
# Replace with the id printed by: npx wrangler d1 create ranilix-email
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# File storage for attachments (free, no card needed)
[[kv_namespaces]]
binding = "FILES"
# Replace with the id printed by: npx wrangler kv namespace create FILES
id = "REPLACE_WITH_YOUR_KV_ID"

[triggers]
crons = ["0 3 * * *"]
